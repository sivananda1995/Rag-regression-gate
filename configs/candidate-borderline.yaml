# Candidate: shrink the reranker's candidate window from 40 to 20, and at the same time
# tighten the tolerance from 2 points to 1. This is the case a plain threshold gate gets
# wrong, and it is the reason the WARN state exists.
#
# Outcome: recall@5 0.9286, delta -0.0152, which breaches the tightened 1 point
# tolerance. But the 95% interval [-0.0386, +0.0024] still contains zero, so 140 queries
# cannot separate this drop from run-to-run noise. Verdict WARN, exit code 0, with the
# reason telling the team to add golden queries before tightening further.
extends: ../ragate.yaml

rerank:
  depth: 20

gate:
  max_absolute_drop: 0.01
