# Candidate: replace sentence-window packing with fixed 240-character slices, a common
# "simplify the pipeline" change. Everything else is inherited from ragate.yaml, so the
# diff a reviewer reads is exactly the change being proposed.
#
# Outcome on the committed golden set: recall@5 0.9438 to 0.8794, and the 95% paired
# bootstrap interval [-0.1017, -0.0318] excludes zero. The gate blocks the build.
extends: ../ragate.yaml

chunking:
  strategy: fixed
  target_chars: 240
  overlap_chars: 0
