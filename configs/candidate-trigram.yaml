# Candidate profile: shorten the character n-gram from 4 to 3, which makes the lexical
# representation more tolerant of the typos present in a quarter of the golden queries.
#
# Outcome: recall@5 0.9121, delta +0.0486, interval [+0.0231, +0.0776]. The gate passes
# and the report lists which queries improved, which is how a retrieval change gets
# defended in review rather than argued about.
corpus:
  path: data/corpus.jsonl
  queries: data/golden_queries.jsonl

chunking:
  strategy: sentence_window
  target_chars: 480
  overlap_chars: 120
  dedupe_identical: true

embedder:
  provider: hashing
  dimensions: 512
  idf_weighting: true
  char_ngram: 3

index:
  backend: flat
  metric: cosine

evaluate:
  k: 5

gate:
  primary_metric: recall_at_k
  max_absolute_drop: 0.02
  bootstrap_confidence: 0.95
  bootstrap_resamples: 5000
  blame_threshold: 0.5
  baseline_path: baselines/baseline.json

logging:
  level: INFO
  format: json
