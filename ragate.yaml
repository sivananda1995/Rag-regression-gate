# Default evaluation profile. Every value here can be overridden by an
# environment variable of the form RAGATE_<SECTION>_<KEY> (see src/ragate/config.py).
corpus:
  path: data/corpus.jsonl
  queries: data/golden_queries.jsonl

chunking:
  strategy: sentence_window   # sentence_window | fixed
  target_chars: 480
  overlap_chars: 120
  dedupe_identical: true

embedder:
  provider: hashing           # hashing | openai
  dimensions: 512
  idf_weighting: true
  char_ngram: 4
  model: ""                   # only used by remote providers

index:
  backend: flat               # flat | faiss
  metric: cosine

retriever:
  # bm25, not hybrid. Fusing the local dense retriever was measured and rejected: it
  # beat bm25 on zero of the 140 golden queries. See docs/adr/ADR-004.
  mode: bm25                  # dense | bm25 | hybrid
  bm25_k1: 1.5
  bm25_b: 0.75
  bm25_weight: 1.0
  dense_weight: 1.0
  rrf_k: 60                   # reciprocal rank fusion damping constant
  candidate_multiplier: 4     # each component retrieves k * this before fusion

rerank:
  # Document-level learned reranker, trained on the train split only.
  # Held-out recall@5 0.9070 without it, 0.9535 with it. See docs/adr/ADR-005.
  enabled: true
  model_path: models/reranker.json
  depth: 40                   # how many candidates the reranker rescores

evaluate:
  k: 5

gate:
  primary_metric: recall_at_k
  # A run fails if the primary metric drops by more than this many points (absolute)
  max_absolute_drop: 0.02
  # ...and the drop is statistically distinguishable from run-to-run noise
  # at this confidence level, using a paired bootstrap over per-query scores.
  bootstrap_confidence: 0.95
  bootstrap_resamples: 5000
  # Queries whose score falls by at least this much are listed in the blame table
  blame_threshold: 0.5
  baseline_path: baselines/baseline.json

logging:
  level: INFO
  format: json
